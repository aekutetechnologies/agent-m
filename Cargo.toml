[workspace]
resolver = "2"
members = ["crates/ai", "crates/agent", "crates/tools", "crates/flow", "crates/mcp", "crates/plugin-sdk", "crates/plugin-loader", "crates/tui", "crates/cli", "plugins/fixture", "plugins/jira", "plugins/github", "plugins/test-runner"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Workspace-wide shared dependencies. Each crate opts in via
# `dep = { workspace = true }`; versions and features are pinned here in one place.
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
libloading = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
futures-util = "0.3"
pulldown-cmark = "0.13"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync", "fs", "signal"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
tracing = "0.1"
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
wiremock = "0.6"
